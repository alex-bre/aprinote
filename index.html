<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aprinote</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Pin an explicit theme choice before first paint. Without an override the
      // page follows the system preference through CSS alone, so nothing flashes.
      try {
        var t = localStorage.getItem('aprinote.theme') || localStorage.getItem('leaf.theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
