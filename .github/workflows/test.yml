name: Tests

# Started by hand only (Actions → Tests → Run workflow), on whichever branch is
# picked there. Deploy and release run the same tests before they publish.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The notices ship inside every build, so a dependency change that forgot
      # `npm run notices` would ship a stale list.
      - name: Third-party notices are current
        run: |
          npm run notices
          git diff --exit-code THIRD-PARTY-NOTICES
